<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://sheets.googleapis.com https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Speed test</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 6px 0; color: #444; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
  button, select, input { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid #bbb; background: #f4f6f8; }
  button.go { background: #17304f; color: #fff; border-color: #17304f; } button:disabled { opacity: .45; }
  input { width: 100%; box-sizing: border-box; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f4f6f8; padding: 10px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<h1>Speed test · phone ↔ Sheet</h1>
<p>A test for MIS only. Nothing is kept on this phone: the sign-in lives in this page until it is closed.</p>
<div class="row"><div id="idbtn"></div><button id="sheets" disabled>Allow Sheets</button></div>
<div class="row"><input id="sheet" placeholder="Test sheet ID (MIS gives it)" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<div class="row"><select id="net"><option>Wi-Fi</option><option>mobile data</option></select>
  <button id="setup" disabled>Fill the read tab (once)</button><button id="run" class="go" disabled>Run the test</button><button id="silent" disabled>Sign-in after a reload?</button></div>
<pre id="out">Open, then: 1 sign in · 2 Allow Sheets · 3 paste the sheet ID · 4 Run the test.</pre>
<script src="../config.js"></script>
<script src="speed.js"></script>
</body>
</html>
